<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>Zafiro POS — Sistema de Punto de Venta</title>
  <meta name="description" content="Zafiro POS v3 — Sistema white-label multi-tenant para restaurantes y retail">
  
  <!-- Favicon -->
  <link rel="icon" href="/assets/zafiro-gem-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/zafiro-logo.svg">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  
  <!-- Libraries CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>
  <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  
  <!-- CSS Principal -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-theme="dark">
  <!-- App Container -->
  <div id="app"></div>
  
  <!-- Loading State -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <img src="/assets/zafiro-logo.svg" alt="Zafiro" class="loading-logo">
      <div class="loading-spinner" id="loading-spinner"></div>
      <p class="loading-text" id="loading-text">Cargando Zafiro POS...</p>
      <div id="loading-error" class="loading-error" hidden>
        <p class="loading-error-msg">No pudimos iniciar la aplicación.</p>
        <button class="loading-retry" onclick="location.reload()">Reintentar</button>
        <button class="loading-logout" onclick="localStorage.clear(); location.href='/login.html';">Cerrar sesión</button>
      </div>
    </div>
  </div>
  
  <!-- JavaScript Modular -->
  <script type="module">
    import { initAppShell } from './js/core/app-shell.js';
    import { startTutorial } from './js/core/tutorial-manager.js';
    import { ZafiroAPI, isAuthenticated, getStoredUser } from './js/core/api-client.js';
    
    async function initializeApp() {
      const loadingText = document.querySelector('.loading-text');
      
      try {
        // 1. Verificar autenticación
        if (!isAuthenticated()) {
          window.location.href = '/login.html';
          return;
        }
        
        loadingText.textContent = 'Verificando sesión...';
        
        // 2. Obtener datos reales del usuario desde API
        let user;
        try {
          user = await ZafiroAPI.auth.me();
          // Actualizar cache local con datos frescos
          localStorage.setItem('zafiro_user', JSON.stringify(user));
        } catch (e) {
          // Fallback a datos locales si la API falla temporalmente
          user = getStoredUser();
          if (!user) {
            window.location.href = '/login.html';
            return;
          }
          console.warn('[Init] API /me falló, usando datos locales:', e.message);
        }
        
        // 3. Obtener branding del tenant
        loadingText.textContent = 'Cargando tu negocio...';
        let branding = { nombre_comercial: 'Zafiro POS', color_primary: '#e25822', tema: 'dark' };
        try {
          branding = await ZafiroAPI.branding.get();
        } catch (e) {
          console.warn('[Init] Branding no disponible, usando defaults:', e.message);
        }
        
        // 4. Aplicar tema dinámico del tenant
        if (branding.tema) {
          document.body.setAttribute('data-theme', branding.tema);
        }
        if (branding.color_primary) {
          document.documentElement.style.setProperty('--tenant-primary', branding.color_primary);
        }
        if (branding.color_secondary) {
          document.documentElement.style.setProperty('--tenant-secondary', branding.color_secondary);
        }
        if (branding.color_accent) {
          document.documentElement.style.setProperty('--tenant-accent', branding.color_accent);
        }
        
        // 5. Ocultar loading con transición suave
        const loadingScreen = document.getElementById('loading-screen');
        loadingScreen.style.opacity = '0';
        setTimeout(() => {
          loadingScreen.style.display = 'none';
        }, 300);
        
        // 6. Inicializar el shell de la aplicación
        initAppShell({
          user: user,
          tenant: { id: user.tenant_id, nombre: branding.nombre_comercial },
          branding: branding
        });
        
        // 7. Verificar onboarding (tutorial primera vez)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('onboarding') === 'true') {
          setTimeout(() => startTutorial(user.rol), 1500);
        }
        
      } catch (error) {
        console.error('[Init] Error crítico:', error);
        const spin = document.getElementById('loading-spinner');
        const errBox = document.getElementById('loading-error');
        const errMsg = errBox?.querySelector('.loading-error-msg');
        if (spin) spin.style.display = 'none';
        if (loadingText) loadingText.textContent = '';
        if (errMsg) errMsg.textContent = error?.message || 'No pudimos iniciar la aplicación.';
        if (errBox) errBox.hidden = false;
      }
    }
    
    // Iniciar cuando DOM esté listo
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
      initializeApp();
    }
  </script>
  
  <!-- Loading Screen Styles (inline para carga instantánea) -->
  <style>
    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0a0a0a;
      transition: opacity 0.3s ease;
    }
    
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    
    .loading-logo {
      width: 120px;
      height: auto;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #1e5fd9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .loading-text {
      color: #a3a3a3;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .loading-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 320px;
      text-align: center;
    }
    .loading-error-msg {
      color: #ef4444;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    .loading-retry, .loading-logout {
      padding: 10px 20px;
      border-radius: 8px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.15s ease;
      width: 200px;
    }
    .loading-retry {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }
    .loading-retry:hover { background: #2563eb; }
    .loading-logout {
      background: transparent;
      color: #a3a3a3;
    }
    .loading-logout:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  </style>
</body>
</html>
