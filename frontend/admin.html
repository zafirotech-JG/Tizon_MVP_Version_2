<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zafiro — Super Admin</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0a0c10;
      --surface:  #111318;
      --surface2: #1a1d24;
      --surface3: #22262e;
      --border:   #2d333b;
      --primary:  #1e5fd9;
      --primary-h:#3b7bf7;
      --primary-glow: rgba(30, 95, 217, 0.3);
      --text:     #f0f3f6;
      --text-sec: #8b949e;
      --success:  #22c55e;
      --success-bg: rgba(34, 197, 94, 0.15);
      --danger:   #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warn:     #f59e0b;
      --warn-bg:  rgba(245, 158, 11, 0.15);
      --info:     #3b82f6;
      --info-bg:  rgba(59, 130, 246, 0.15);
      --radius:   12px;
      --radius-sm: 8px;
      --shadow:   0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Login ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: radial-gradient(ellipse at 30% 20%, rgba(30, 95, 217, 0.15) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(59, 123, 247, 0.1) 0%, transparent 50%),
                  var(--bg);
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo img {
      width: 100px;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 4px 16px rgba(30, 95, 217, 0.4));
    }

    .login-card h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--text) 0%, var(--text-sec) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .login-card p {
      color: var(--text-sec);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    /* ── Panel ── */
    #admin-panel { display: none; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .brand img {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 2px 8px rgba(30, 95, 217, 0.3));
    }

    header .brand h1 { 
      font-size: 1.1rem; 
      font-weight: 700;
      background: linear-gradient(135deg, var(--text) 0%, var(--primary-h) 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    header .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header span { color: var(--text-sec); font-size: 0.85rem; }

    main { padding: 32px; max-width: 1400px; margin: 0 auto; }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .page-title-group p {
      color: var(--text-sec);
      font-size: 0.9rem;
    }

    /* ── Stats Cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: transform 0.15s, border-color 0.15s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .stat-icon.blue { background: var(--info-bg); color: var(--info); }
    .stat-icon.green { background: var(--success-bg); color: var(--success); }
    .stat-icon.orange { background: var(--warn-bg); color: var(--warn); }
    .stat-icon.red { background: var(--danger-bg); color: var(--danger); }

    .stat-info h3 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-info p {
      color: var(--text-sec);
      font-size: 0.85rem;
    }

    /* ── Search & Filter ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sec);
      font-size: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 14px 12px 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .filter-group {
      display: flex;
      gap: 8px;
    }

    /* ── Tabla ── */
    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--surface2);
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: var(--surface2); }

    .td-nombre { font-weight: 600; font-size: 0.95rem; }
    .td-email  { color: var(--text-sec); font-size: 0.85rem; margin-top: 2px; }
    .td-plan   { font-size: 0.85rem; color: var(--text-sec); }

    /* ── Tenant Row Details ── */
    .tenant-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tenant-avatar {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-h) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      color: white;
    }

    .tenant-meta {
      display: flex;
      flex-direction: column;
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-active {
      background: var(--success-bg);
      color: var(--success);
    }

    .badge-suspended {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .badge-warn {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .badge-info {
      background: var(--info-bg);
      color: var(--info);
    }

    .badge-plan {
      background: var(--surface3);
      color: var(--text-sec);
      border: 1px solid var(--border);
    }

    .badge-expiring {
      background: linear-gradient(135deg, var(--warn-bg) 0%, var(--danger-bg) 100%);
      color: var(--warn);
    }

    /* ── Acciones ── */
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-sec);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-size: 18px;
    }

    .btn-icon:hover {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--primary);
    }

    .btn-icon.danger:hover {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger);
    }

    /* ── Formularios y botones ── */
    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-sec);
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus, select:focus { 
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-h) 100%);
      color: #fff;
      box-shadow: 0 2px 8px var(--primary-glow);
    }
    .btn-primary:hover:not(:disabled) { 
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { 
      background: var(--surface2);
      border-color: var(--primary);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn-danger:hover:not(:disabled) { 
      background: rgba(239,68,68,0.25);
      border-color: var(--danger);
    }

    .btn-success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(34,197,94,0.3);
    }
    .btn-success:hover:not(:disabled) { 
      background: rgba(34,197,94,0.25);
      border-color: var(--success);
    }

    .btn-warn {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid rgba(245,158,11,0.3);
    }
    .btn-warn:hover:not(:disabled) { 
      background: rgba(245,158,11,0.25);
      border-color: var(--warn);
    }

    .btn-full { width: 100%; padding: 14px; font-size: 1rem; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      font-size: 0.9rem;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.25s, transform 0.25s;
      z-index: 1000;
      max-width: 400px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { border-color: var(--success); background: var(--success-bg); }
    #toast.error { border-color: var(--danger); background: var(--danger-bg); }
    #toast.warning { border-color: var(--warn); background: var(--warn-bg); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.visible { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.2s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 24px 24px 0;
    }

    .modal-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .modal-body {
      padding: 20px 24px;
    }

    .modal-footer {
      padding: 0 24px 24px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-footer .btn { flex: 1; }
    .modal-footer .btn:last-child { flex: 2; }

    /* ── Empty / Loading ── */
    .empty-cell {
      text-align: center;
      color: var(--text-sec);
      padding: 60px 20px;
    }

    .empty-cell i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    /* ── Logout btn ── */
    #btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-sec);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #btn-logout:hover { 
      color: var(--text); 
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      header { padding: 0 16px; }
      main { padding: 20px 16px; }
      .stats-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .search-box { min-width: auto; }
      th, td { padding: 12px; font-size: 0.85rem; }
      .actions { flex-wrap: nowrap; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <img src="/assets/zafiro-logo-new.png" alt="Zafiro POS">
      <h1>Super Admin</h1>
      <p>Acceso restringido a administradores del sistema</p>
    </div>

    <div class="form-group">
      <label for="inp-email">Correo electrónico</label>
      <input type="email" id="inp-email" placeholder="admin@zafiro.co" autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="inp-password">Contraseña</label>
      <input type="password" id="inp-password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary btn-full" id="btn-login">
      <i class="ph ph-sign-in"></i> Entrar
    </button>
  </div>
</div>

<!-- ══ PANEL ══ -->
<div id="admin-panel">
  <header>
    <div class="brand">
      <img src="/assets/zafiro-logo-new.png" alt="Zafiro">
      <h1>Super Admin</h1>
    </div>
    <div class="header-actions">
      <span id="admin-email-label"></span>
      <button id="btn-logout">
        <i class="ph ph-sign-out"></i> Salir
      </button>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div class="page-title-group">
        <h1>Panel de Control</h1>
        <p>Gestión de tenants, suscripciones y sistema</p>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue">
          <i class="ph ph-buildings"></i>
        </div>
        <div class="stat-info">
          <h3 id="stat-total">—</h3>
          <p>Total Tenants</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">
          <i class="ph ph-check-circle"></i>
        </div>
        <div class="stat-info">
          <h3 id="stat-active">—</h3>
          <p>Activos</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange">
          <i class="ph ph-warning-circle"></i>
        </div>
        <div class="stat-info">
          <h3 id="stat-expiring">—</h3>
          <p>Por vencer (7d)</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red">
          <i class="ph ph-prohibit"></i>
        </div>
        <div class="stat-info">
          <h3 id="stat-suspended">—</h3>
          <p>Suspendidos</p>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <i class="ph ph-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Buscar por nombre, email o plan...">
      </div>
      <div class="filter-group">
        <select id="filter-status" class="btn btn-ghost">
          <option value="all">Todos los estados</option>
          <option value="active">Activos</option>
          <option value="suspended">Suspendidos</option>
          <option value="expiring">Por vencer</option>
        </select>
        <select id="filter-plan" class="btn btn-ghost">
          <option value="all">Todos los planes</option>
          <option value="free">Gratis</option>
          <option value="basic">Básico</option>
          <option value="pro">Pro</option>
          <option value="enterprise">Enterprise</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btn-refresh">
        <i class="ph ph-arrows-clockwise"></i> Actualizar
      </button>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Tenant</th>
            <th>Plan</th>
            <th>Estado</th>
            <th>Vencimiento</th>
            <th>Registrado</th>
            <th style="width: 180px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="6" class="empty-cell">
            <i class="ph ph-spinner ph-spin"></i>
            <p>Cargando tenants...</p>
          </td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ══ TOAST ══ -->
<div id="toast"></div>

<!-- ══ MODAL EDIT TENANT ══ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Editar Tenant</h2>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <label for="edit-nombre">Nombre del negocio</label>
        <input type="text" id="edit-nombre" placeholder="Nombre del negocio">
      </div>
      <div class="form-group">
        <label for="edit-email">Correo electrónico</label>
        <input type="email" id="edit-email" placeholder="email@ejemplo.com">
      </div>
      <div class="form-group">
        <label for="edit-plan">Plan</label>
        <select id="edit-plan">
          <option value="free">Gratis</option>
          <option value="basic">Básico</option>
          <option value="pro">Pro</option>
          <option value="enterprise">Enterprise</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="btn-cancel-edit">Cancelar</button>
      <button class="btn btn-primary" id="btn-save-edit">
        <i class="ph ph-floppy-disk"></i> Guardar cambios
      </button>
    </div>
  </div>
</div>

<script>
  // ── Estado ──────────────────────────────────────────────────────────────
  let adminToken = localStorage.getItem("tizon_admin_token");
  let tenants    = [];
  let filteredTenants = [];
  let editingId  = null;

  // ── Init ─────────────────────────────────────────────────────────────────
  if (adminToken) {
    mostrarPanel();
    cargarTenants();
  } else {
    mostrarLogin();
  }

  // ── API helper ────────────────────────────────────────────────────────────
  function parsearError(status, data) {
    if (status === 401) return "Credenciales incorrectas. Verifica tu correo y contraseña.";
    if (status === 403) return "Acceso denegado. Esta cuenta no tiene permisos de administrador.";
    if (status === 404) return "Recurso no encontrado.";
    if (status === 422) {
      const detail = data?.detail;
      if (Array.isArray(detail)) {
        return detail.map(e => {
          const campo = e.loc?.slice(-1)[0] || "campo";
          if (e.msg?.includes("email")) return `Correo electrónico inválido.`;
          if (e.msg?.includes("missing") || e.msg?.includes("required")) return `El campo "${campo}" es obligatorio.`;
          return `Error en "${campo}": ${e.msg}`;
        }).join(" ");
      }
      if (typeof detail === "string") return detail;
      return "Datos inválidos. Verifica el correo y la contraseña.";
    }
    if (status >= 500) return "Error interno del servidor. Intenta de nuevo en unos segundos.";
    return data?.detail || `Error inesperado (código ${status}).`;
  }

  async function api(method, path, body) {
    const opts = {
      method,
      headers: { "Content-Type": "application/json" },
    };
    if (adminToken) opts.headers["Authorization"] = `Bearer ${adminToken}`;
    if (body !== undefined) opts.body = JSON.stringify(body);

    const res  = await fetch(path, opts);
    const data = await res.json().catch(() => null);

    if (res.status === 401 && path !== "/api/admin/login") {
      cerrarSesion();
      throw new Error("Sesión expirada. Inicia sesión nuevamente.");
    }
    if (!res.ok) throw new Error(parsearError(res.status, data));
    return data;
  }

  // ── Login ─────────────────────────────────────────────────────────────────
  document.getElementById("btn-login").addEventListener("click", handleLogin);
  document.getElementById("inp-password").addEventListener("keypress", e => {
    if (e.key === "Enter") handleLogin();
  });

  async function handleLogin() {
    const btn      = document.getElementById("btn-login");
    const email    = document.getElementById("inp-email").value.trim();
    const password = document.getElementById("inp-password").value;

    if (!email && !password) { toast("Ingresa tu correo y contraseña.", "warning"); return; }
    if (!email)    { toast("El correo electrónico es obligatorio.", "warning"); return; }
    if (!password) { toast("La contraseña es obligatoria.", "warning"); return; }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) { toast("Ingresa un correo electrónico válido.", "warning"); return; }

    btn.disabled    = true;
    btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Ingresando…';

    try {
      const res = await api("POST", "/api/admin/login", { email, password });
      adminToken = res.access_token;
      localStorage.setItem("tizon_admin_token", adminToken);
      mostrarPanel();
      cargarTenants();
    } catch (err) {
      toast(err.message, "error");
      document.getElementById("inp-password").value = "";
      document.getElementById("inp-email").focus();
    } finally {
      btn.disabled    = false;
      btn.innerHTML = '<i class="ph ph-sign-in"></i> Entrar';
    }
  }

  // ── Logout ────────────────────────────────────────────────────────────────
  document.getElementById("btn-logout").addEventListener("click", cerrarSesion);

  function cerrarSesion() {
    localStorage.removeItem("tizon_admin_token");
    adminToken = null;
    tenants    = [];
    mostrarLogin();
  }

  // ── Pantallas ─────────────────────────────────────────────────────────────
  function mostrarLogin() {
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("admin-panel").style.display  = "none";
  }

  function mostrarPanel() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("admin-panel").style.display  = "block";

    // Decodifica payload del JWT para mostrar el email del admin
    try {
      const payload = JSON.parse(atob(adminToken.split(".")[1]));
      document.getElementById("admin-email-label").textContent = payload.sub || "";
    } catch { /* no crítico */ }
  }

  // ── Stats ─────────────────────────────────────────────────────────────────
  function updateStats() {
    const total = tenants.length;
    const active = tenants.filter(t => t.plan_activo).length;
    const suspended = tenants.filter(t => !t.plan_activo).length;
    const expiring = tenants.filter(t => {
      if (!t.fecha_vencimiento || !t.plan_activo) return false;
      const dias = Math.ceil((new Date(t.fecha_vencimiento) - new Date()) / 86400000);
      return dias <= 7 && dias >= 0;
    }).length;

    document.getElementById("stat-total").textContent = total;
    document.getElementById("stat-active").textContent = active;
    document.getElementById("stat-expiring").textContent = expiring;
    document.getElementById("stat-suspended").textContent = suspended;
  }

  // ── Search & Filters ──────────────────────────────────────────────────────
  document.getElementById("search-input").addEventListener("input", applyFilters);
  document.getElementById("filter-status").addEventListener("change", applyFilters);
  document.getElementById("filter-plan").addEventListener("change", applyFilters);

  function applyFilters() {
    const search = document.getElementById("search-input").value.toLowerCase();
    const statusFilter = document.getElementById("filter-status").value;
    const planFilter = document.getElementById("filter-plan").value;

    filteredTenants = tenants.filter(t => {
      // Search
      const matchesSearch = !search || 
        t.nombre?.toLowerCase().includes(search) ||
        t.email?.toLowerCase().includes(search) ||
        t.plan?.toLowerCase().includes(search);

      // Status filter
      let matchesStatus = true;
      if (statusFilter === "active") matchesStatus = t.plan_activo;
      else if (statusFilter === "suspended") matchesStatus = !t.plan_activo;
      else if (statusFilter === "expiring") {
        if (!t.fecha_vencimiento || !t.plan_activo) matchesStatus = false;
        else {
          const dias = Math.ceil((new Date(t.fecha_vencimiento) - new Date()) / 86400000);
          matchesStatus = dias <= 7 && dias >= 0;
        }
      }

      // Plan filter
      const matchesPlan = planFilter === "all" || t.plan?.toLowerCase() === planFilter;

      return matchesSearch && matchesStatus && matchesPlan;
    });

    renderTabla();
  }

  // ── Cargar tenants ────────────────────────────────────────────────────────
  document.getElementById("btn-refresh").addEventListener("click", cargarTenants);

  async function cargarTenants() {
    const btn = document.getElementById("btn-refresh");
    btn.disabled    = true;
    btn.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Cargando…';

    try {
      tenants = await api("GET", "/api/admin/tenants");
      filteredTenants = [...tenants];
      updateStats();
      applyFilters();
    } catch (err) {
      toast(err.message, "error");
      document.getElementById("tabla-body").innerHTML =
        `<tr><td colspan="6" class="empty-cell"><i class="ph ph-warning-circle"></i><p>Error cargando datos</p></td></tr>`;
    } finally {
      btn.disabled    = false;
      btn.innerHTML = '<i class="ph ph-arrows-clockwise"></i> Actualizar';
    }
  }

  // ── Render tabla ──────────────────────────────────────────────────────────
  function renderTabla() {
    const tbody = document.getElementById("tabla-body");

    if (filteredTenants.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-cell"><i class="ph ph-magnifying-glass"></i><p>No se encontraron tenants</p></td></tr>`;
      return;
    }

    tbody.innerHTML = filteredTenants.map(t => {
      const initials = t.nombre?.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase() || '?';
      const badgeActivo = t.plan_activo
        ? `<span class="badge badge-active"><i class="ph ph-check"></i> Activo</span>`
        : `<span class="badge badge-suspended"><i class="ph ph-x"></i> Suspendido</span>`;

      const venc = formatFecha(t.fecha_vencimiento);
      const vencBadge = badgeVencimiento(t.fecha_vencimiento);
      const planBadge = `<span class="badge badge-plan">${esc(t.plan || 'free')}</span>`;

      return `<tr>
        <td>
          <div class="tenant-info">
            <div class="tenant-avatar">${esc(initials)}</div>
            <div class="tenant-meta">
              <div class="td-nombre">${esc(t.nombre)}</div>
              <div class="td-email">${esc(t.email)}</div>
            </div>
          </div>
        </td>
        <td>${planBadge}</td>
        <td>${badgeActivo}</td>
        <td>
          ${vencBadge}
          <div style="font-size:0.8rem;color:var(--text-sec);margin-top:4px;">${venc}</div>
        </td>
        <td style="color:var(--text-sec);font-size:0.85rem;">${formatFecha(t.creado_en)}</td>
        <td>
          <div class="actions">
            <button class="btn-icon" title="${t.plan_activo ? 'Suspender' : 'Activar'}" data-action="toggle" data-id="${t.id}" data-activo="${t.plan_activo}">
              <i class="ph ${t.plan_activo ? 'ph-pause' : 'ph-play'}"></i>
            </button>
            <button class="btn-icon" title="Renovar +30 días" data-action="renovar" data-id="${t.id}" data-venc="${t.fecha_vencimiento || ''}">
              <i class="ph ph-calendar-plus"></i>
            </button>
            <button class="btn-icon" title="Editar" data-action="edit" data-id="${t.id}">
              <i class="ph ph-pencil-simple"></i>
            </button>
            <button class="btn-icon danger" title="Eliminar" data-action="delete" data-id="${t.id}">
              <i class="ph ph-trash"></i>
            </button>
          </div>
        </td>
      </tr>`;
    }).join("");

    // Bind botones
    tbody.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        if (action === "toggle")  handleToggle(btn);
        if (action === "renovar") handleRenovar(btn);
        if (action === "edit")    openEditModal(Number(btn.dataset.id));
        if (action === "delete")  handleDelete(Number(btn.dataset.id));
      });
    });
  }

  // ── Acciones ──────────────────────────────────────────────────────────────
  async function handleToggle(btn) {
    const id       = Number(btn.dataset.id);
    const activo   = btn.dataset.activo === "true";
    const nuevoVal = !activo;
    const label    = nuevoVal ? "activar" : "suspender";

    if (!confirm(`¿Seguro que deseas ${label} este tenant?`)) return;

    btn.disabled = true;
    try {
      await api("PATCH", `/api/admin/tenants/${id}`, { plan_activo: nuevoVal });
      const t = tenants.find(x => x.id === id);
      if (t) t.plan_activo = nuevoVal;
      updateStats();
      applyFilters();
      toast(`Tenant ${nuevoVal ? "activado" : "suspendido"} exitosamente`, "success");
    } catch (err) {
      toast(err.message, "error");
      btn.disabled = false;
    }
  }

  async function handleRenovar(btn) {
    const id          = Number(btn.dataset.id);
    const vencActual  = btn.dataset.venc;

    const base = vencActual && new Date(vencActual) > new Date()
      ? new Date(vencActual)
      : new Date();
    base.setDate(base.getDate() + 30);

    btn.disabled    = true;
    try {
      const res = await api("PATCH", `/api/admin/tenants/${id}`, {
        fecha_vencimiento: base.toISOString(),
      });
      const t = tenants.find(x => x.id === id);
      if (t) t.fecha_vencimiento = res.fecha_vencimiento;
      updateStats();
      applyFilters();
      toast("Suscripción renovada 30 días", "success");
    } catch (err) {
      toast(err.message, "error");
      btn.disabled    = false;
    }
  }

  async function handleDelete(id) {
    const t = tenants.find(x => x.id === id);
    if (!t) return;

    if (!confirm(`¿Eliminar permanentemente el tenant "${t.nombre}"?\n\nEsta acción no se puede deshacer y eliminará todos los datos del tenant.`)) return;

    try {
      await api("DELETE", `/api/admin/tenants/${id}`);
      tenants = tenants.filter(x => x.id !== id);
      updateStats();
      applyFilters();
      toast("Tenant eliminado permanentemente", "success");
    } catch (err) {
      toast(err.message || "Error al eliminar tenant", "error");
    }
  }

  // ── Edit Modal ─────────────────────────────────────────────────────────────
  const modalOverlay = document.getElementById("modal-overlay");
  const btnCancelEdit = document.getElementById("btn-cancel-edit");
  const btnSaveEdit = document.getElementById("btn-save-edit");

  btnCancelEdit.addEventListener("click", closeEditModal);
  modalOverlay.addEventListener("click", e => {
    if (e.target === modalOverlay) closeEditModal();
  });
  btnSaveEdit.addEventListener("click", saveEdit);

  function openEditModal(id) {
    const t = tenants.find(x => x.id === id);
    if (!t) return;

    editingId = id;
    document.getElementById("edit-id").value = id;
    document.getElementById("edit-nombre").value = t.nombre || "";
    document.getElementById("edit-email").value = t.email || "";
    document.getElementById("edit-plan").value = t.plan || "free";

    modalOverlay.classList.add("visible");
  }

  function closeEditModal() {
    modalOverlay.classList.remove("visible");
    editingId = null;
  }

  async function saveEdit() {
    if (!editingId) return;

    const nombre = document.getElementById("edit-nombre").value.trim();
    const email = document.getElementById("edit-email").value.trim();
    const plan = document.getElementById("edit-plan").value;

    if (!nombre) { toast("El nombre es obligatorio", "warning"); return; }
    if (!email) { toast("El correo es obligatorio", "warning"); return; }

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) { toast("Ingresa un correo válido", "warning"); return; }

    btnSaveEdit.disabled = true;
    btnSaveEdit.innerHTML = '<i class="ph ph-spinner ph-spin"></i> Guardando…';

    try {
      await api("PATCH", `/api/admin/tenants/${editingId}`, { nombre, email, plan });
      const t = tenants.find(x => x.id === editingId);
      if (t) {
        t.nombre = nombre;
        t.email = email;
        t.plan = plan;
      }
      applyFilters();
      closeEditModal();
      toast("Tenant actualizado exitosamente", "success");
    } catch (err) {
      toast(err.message, "error");
    } finally {
      btnSaveEdit.disabled = false;
      btnSaveEdit.innerHTML = '<i class="ph ph-floppy-disk"></i> Guardar cambios';
    }
  }

  // ── Utilidades ────────────────────────────────────────────────────────────
  function formatFecha(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString("es-CO", {
      year: "numeric", month: "short", day: "numeric",
    });
  }

  function badgeVencimiento(iso) {
    if (!iso) return `<span class="badge badge-info">Sin vencimiento</span>`;
    const fecha  = new Date(iso);
    const ahora  = new Date();
    const dias   = Math.ceil((fecha - ahora) / 86400000);
    if (dias < 0)  return `<span class="badge badge-suspended"><i class="ph ph-warning"></i> Vencido</span>`;
    if (dias <= 7) return `<span class="badge badge-expiring"><i class="ph ph-clock"></i> ${dias}d restantes</span>`;
    return `<span class="badge badge-active"><i class="ph ph-check-circle"></i> Vigente</span>`;
  }

  function esc(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  let _toastTimer;
  function toast(msg, type = "success") {
    const el = document.getElementById("toast");
    el.className = "show " + type;
    
    const icon = type === "error" ? "ph-x-circle" 
               : type === "warning" ? "ph-warning" 
               : "ph-check-circle";
    
    el.innerHTML = `<i class="ph ${icon}" style="font-size: 20px;"></i><span>${msg}</span>`;
    
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
  }
</script>
</body>
</html>
