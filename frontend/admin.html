<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tizón — Super Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0d0b;
      --surface:  #1a1714;
      --surface2: #231f1b;
      --border:   #2e2825;
      --primary:  #e25822;
      --primary-h:#c94a1a;
      --text:     #f0ece8;
      --muted:    #8a7a6e;
      --success:  #22c55e;
      --danger:   #ef4444;
      --warn:     #f59e0b;
      --radius:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }

    .login-card h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .login-card p {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    /* ── Panel ── */
    #admin-panel { display: none; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 { font-size: 1rem; font-weight: 600; }
    header span { color: var(--muted); font-size: 0.82rem; }

    main { padding: 28px; max-width: 1100px; margin: 0 auto; }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    /* ── Tabla ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--surface2);
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(255,255,255,0.02); }

    .td-nombre { font-weight: 600; }
    .td-email  { color: var(--muted); font-size: 0.85rem; }
    .td-plan   { font-size: 0.82rem; color: var(--muted); }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-active {
      background: rgba(34,197,94,0.15);
      color: var(--success);
    }

    .badge-suspended {
      background: rgba(239,68,68,0.15);
      color: var(--danger);
    }

    .badge-warn {
      background: rgba(245,158,11,0.15);
      color: var(--warn);
    }

    /* ── Acciones ── */
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* ── Formularios y botones ── */
    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--primary); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-h); }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface2); }

    .btn-danger {
      background: rgba(239,68,68,0.15);
      color: var(--danger);
      border: 1px solid rgba(239,68,68,0.25);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.25); }

    .btn-success {
      background: rgba(34,197,94,0.15);
      color: var(--success);
      border: 1px solid rgba(34,197,94,0.25);
    }
    .btn-success:hover:not(:disabled) { background: rgba(34,197,94,0.25); }

    .btn-warn {
      background: rgba(245,158,11,0.15);
      color: var(--warn);
      border: 1px solid rgba(245,158,11,0.25);
    }
    .btn-warn:hover:not(:disabled) { background: rgba(245,158,11,0.25); }

    .btn-full { width: 100%; padding: 12px; font-size: 0.95rem; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 0.88rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
      max-width: 320px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── Empty / Loading ── */
    .empty-cell {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
    }

    /* ── Logout btn ── */
    #btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: color 0.15s, border-color 0.15s;
    }
    #btn-logout:hover { color: var(--text); border-color: var(--muted); }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-card">
    <h1>🔥 Tizón Admin</h1>
    <p>Acceso restringido a super-administradores</p>

    <div class="form-group">
      <label for="inp-email">Correo</label>
      <input type="email" id="inp-email" placeholder="admin@tizon.co" autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="inp-password">Contraseña</label>
      <input type="password" id="inp-password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary btn-full" id="btn-login">Entrar</button>
  </div>
</div>

<!-- ══ PANEL ══ -->
<div id="admin-panel">
  <header>
    <h1>🔥 Tizón — Super Admin</h1>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="admin-email-label"></span>
      <button id="btn-logout">Salir</button>
    </div>
  </header>

  <main>
    <div class="page-title">Tenants</div>
    <div class="page-subtitle">Gestión de cuentas y suscripciones</div>

    <div style="margin-bottom:16px;display:flex;justify-content:flex-end;">
      <button class="btn btn-ghost" id="btn-refresh">↻ Actualizar</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Negocio</th>
            <th>Plan</th>
            <th>Estado</th>
            <th>Vencimiento</th>
            <th>Registrado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-body">
          <tr><td colspan="6" class="empty-cell">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- ══ TOAST ══ -->
<div id="toast"></div>

<script>
  // ── Estado ──────────────────────────────────────────────────────────────
  let adminToken = localStorage.getItem("tizon_admin_token");
  let tenants    = [];

  // ── Init ─────────────────────────────────────────────────────────────────
  if (adminToken) {
    mostrarPanel();
    cargarTenants();
  } else {
    mostrarLogin();
  }

  // ── API helper ────────────────────────────────────────────────────────────
  async function api(method, path, body) {
    const opts = {
      method,
      headers: { "Content-Type": "application/json" },
    };
    if (adminToken) opts.headers["Authorization"] = `Bearer ${adminToken}`;
    if (body !== undefined) opts.body = JSON.stringify(body);

    const res  = await fetch(path, opts);
    const data = await res.json().catch(() => null);

    if (res.status === 401) {
      cerrarSesion();
      throw new Error("Sesión expirada");
    }
    if (!res.ok) throw new Error(data?.detail || `Error ${res.status}`);
    return data;
  }

  // ── Login ─────────────────────────────────────────────────────────────────
  document.getElementById("btn-login").addEventListener("click", handleLogin);
  document.getElementById("inp-password").addEventListener("keypress", e => {
    if (e.key === "Enter") handleLogin();
  });

  async function handleLogin() {
    const btn      = document.getElementById("btn-login");
    const email    = document.getElementById("inp-email").value.trim();
    const password = document.getElementById("inp-password").value;

    if (!email || !password) { toast("Completa los dos campos", "warn"); return; }

    btn.disabled    = true;
    btn.textContent = "Ingresando…";

    try {
      const res = await api("POST", "/api/admin/login", { username: email, password });
      adminToken = res.access_token;
      localStorage.setItem("tizon_admin_token", adminToken);
      mostrarPanel();
      cargarTenants();
    } catch (err) {
      toast(err.message, "error");
    } finally {
      btn.disabled    = false;
      btn.textContent = "Entrar";
    }
  }

  // ── Logout ────────────────────────────────────────────────────────────────
  document.getElementById("btn-logout").addEventListener("click", cerrarSesion);

  function cerrarSesion() {
    localStorage.removeItem("tizon_admin_token");
    adminToken = null;
    tenants    = [];
    mostrarLogin();
  }

  // ── Pantallas ─────────────────────────────────────────────────────────────
  function mostrarLogin() {
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("admin-panel").style.display  = "none";
  }

  function mostrarPanel() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("admin-panel").style.display  = "block";

    // Decodifica payload del JWT para mostrar el email del admin
    try {
      const payload = JSON.parse(atob(adminToken.split(".")[1]));
      document.getElementById("admin-email-label").textContent = payload.sub || "";
    } catch { /* no crítico */ }
  }

  // ── Cargar tenants ────────────────────────────────────────────────────────
  document.getElementById("btn-refresh").addEventListener("click", cargarTenants);

  async function cargarTenants() {
    const btn = document.getElementById("btn-refresh");
    btn.disabled    = true;
    btn.textContent = "Cargando…";

    try {
      tenants = await api("GET", "/api/admin/tenants");
      renderTabla();
    } catch (err) {
      toast(err.message, "error");
      document.getElementById("tabla-body").innerHTML =
        `<tr><td colspan="6" class="empty-cell">Error cargando datos</td></tr>`;
    } finally {
      btn.disabled    = false;
      btn.textContent = "↻ Actualizar";
    }
  }

  // ── Render tabla ──────────────────────────────────────────────────────────
  function renderTabla() {
    const tbody = document.getElementById("tabla-body");

    if (tenants.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-cell">Sin tenants registrados</td></tr>`;
      return;
    }

    tbody.innerHTML = tenants.map(t => {
      const badgeActivo = t.plan_activo
        ? `<span class="badge badge-active">● Activo</span>`
        : `<span class="badge badge-suspended">● Suspendido</span>`;

      const venc = formatFecha(t.fecha_vencimiento);
      const vencBadge = badgeVencimiento(t.fecha_vencimiento);

      const btnToggle = t.plan_activo
        ? `<button class="btn btn-danger"  data-action="toggle" data-id="${t.id}" data-activo="true">Suspender</button>`
        : `<button class="btn btn-success" data-action="toggle" data-id="${t.id}" data-activo="false">Activar</button>`;

      const btnRenovar = `<button class="btn btn-warn" data-action="renovar" data-id="${t.id}" data-venc="${t.fecha_vencimiento || ''}">+30 días</button>`;

      return `<tr>
        <td>
          <div class="td-nombre">${esc(t.nombre)}</div>
          <div class="td-email">${esc(t.email)}</div>
        </td>
        <td class="td-plan">${esc(t.plan || '—')}</td>
        <td>${badgeActivo}</td>
        <td>${vencBadge}<div style="font-size:0.8rem;color:var(--muted);margin-top:3px;">${venc}</div></td>
        <td style="color:var(--muted);font-size:0.82rem;">${formatFecha(t.creado_en)}</td>
        <td><div class="actions">${btnToggle}${btnRenovar}</div></td>
      </tr>`;
    }).join("");

    // Bind botones
    tbody.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.action === "toggle")  handleToggle(btn);
        if (btn.dataset.action === "renovar") handleRenovar(btn);
      });
    });
  }

  // ── Acciones ──────────────────────────────────────────────────────────────
  async function handleToggle(btn) {
    const id       = Number(btn.dataset.id);
    const activo   = btn.dataset.activo === "true";
    const nuevoVal = !activo;
    const label    = nuevoVal ? "activar" : "suspender";

    if (!confirm(`¿Seguro que deseas ${label} este tenant?`)) return;

    btn.disabled = true;
    try {
      await api("PATCH", `/api/admin/tenants/${id}`, { plan_activo: nuevoVal });
      const t = tenants.find(x => x.id === id);
      if (t) t.plan_activo = nuevoVal;
      renderTabla();
      toast(`Tenant ${nuevoVal ? "activado" : "suspendido"}`, "ok");
    } catch (err) {
      toast(err.message, "error");
      btn.disabled = false;
    }
  }

  async function handleRenovar(btn) {
    const id          = Number(btn.dataset.id);
    const vencActual  = btn.dataset.venc;

    // Si tiene fecha futura, suma 30 días a esa; si no, suma 30 desde hoy
    const base = vencActual && new Date(vencActual) > new Date()
      ? new Date(vencActual)
      : new Date();
    base.setDate(base.getDate() + 30);

    btn.disabled    = true;
    btn.textContent = "…";
    try {
      const res = await api("PATCH", `/api/admin/tenants/${id}`, {
        fecha_vencimiento: base.toISOString(),
      });
      const t = tenants.find(x => x.id === id);
      if (t) t.fecha_vencimiento = res.fecha_vencimiento;
      renderTabla();
      toast("Suscripción renovada 30 días", "ok");
    } catch (err) {
      toast(err.message, "error");
      btn.disabled    = false;
      btn.textContent = "+30 días";
    }
  }

  // ── Utilidades ────────────────────────────────────────────────────────────
  function formatFecha(iso) {
    if (!iso) return "—";
    return new Date(iso).toLocaleDateString("es-CO", {
      year: "numeric", month: "short", day: "numeric",
    });
  }

  function badgeVencimiento(iso) {
    if (!iso) return "";
    const fecha  = new Date(iso);
    const ahora  = new Date();
    const dias   = Math.ceil((fecha - ahora) / 86400000);
    if (dias < 0)  return `<span class="badge badge-suspended">Vencido</span>`;
    if (dias <= 7) return `<span class="badge badge-warn">Vence en ${dias}d</span>`;
    return `<span class="badge badge-active">Vigente</span>`;
  }

  function esc(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  let _toastTimer;
  function toast(msg, type = "ok") {
    const el    = document.getElementById("toast");
    const color = type === "error" ? "var(--danger)"
                : type === "warn"  ? "var(--warn)"
                : "var(--success)";
    el.style.borderColor = color;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
  }
</script>
</body>
</html>
